name: CI/CD Pipeline - Build & Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy AssessHub
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # 1. Checkout source code
      # ─────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. Setup SSH Key (stored as base64 in secret)
      # ─────────────────────────────────────────
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          echo "SSH key configured successfully"

      # ─────────────────────────────────────────
      # 3. Build Spring Boot Backend
      # ─────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Backend JAR
        run: |
          cd backend
          mvn clean package -DskipTests
          echo "Backend JAR built successfully"
          ls -lh target/*.jar

      # ─────────────────────────────────────────
      # 4. Build React Frontend
      # ─────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          echo "Frontend built successfully"
          ls -lh dist/

      # ─────────────────────────────────────────
      # 5. Upload compiled artifacts to EC2
      # ─────────────────────────────────────────
      - name: Upload Backend JAR to EC2
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            backend/target/platform-0.0.1-SNAPSHOT.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/platform-0.0.1-SNAPSHOT.jar
          echo "Backend JAR uploaded"

      - name: Upload Frontend Build to EC2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /tmp/assesshub-dist"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            frontend/dist/. \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/assesshub-dist/
          echo "Frontend build uploaded"

      # ─────────────────────────────────────────
      # 6. SSH into EC2 and deploy
      # ─────────────────────────────────────────
      - name: Deploy to EC2 and Restart Services
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash -s << 'ENDSSH'
          echo "=== Starting Deployment on EC2 ==="

          sudo systemctl stop assesshub-backend
          echo "Backend service stopped"

          sudo cp /tmp/platform-0.0.1-SNAPSHOT.jar \
                  /opt/assesshub/backend/target/platform-0.0.1-SNAPSHOT.jar
          echo "Backend JAR updated"

          sudo rsync -a --delete /tmp/assesshub-dist/ /var/www/assesshub/
          sudo chown -R www-data:www-data /var/www/assesshub
          echo "Frontend static files updated"

          sudo systemctl start assesshub-backend
          echo "Backend service restarted"

          sudo systemctl reload nginx
          echo "Nginx reloaded"

          rm -f /tmp/platform-0.0.1-SNAPSHOT.jar
          rm -rf /tmp/assesshub-dist

          echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
          sudo systemctl status assesshub-backend --no-pager
          ENDSSH
